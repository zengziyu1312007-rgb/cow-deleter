name: Build Windows and macOS apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean NiuLaiCleaner.spec
      - uses: actions/upload-artifact@v4
        with:
          name: NiuLaiCleaner-Windows
          path: dist/NiuLaiCleaner.exe

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean NiuLaiCleaner-macOS.spec
      - run: ditto -c -k --sequesterRsrc --keepParent dist/NiuLaiCleaner.app dist/NiuLaiCleaner-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NiuLaiCleaner-macOS
          path: dist/NiuLaiCleaner-macOS.zip
